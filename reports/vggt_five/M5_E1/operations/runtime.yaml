# Plain M5: exact optimized G3 runtime with research/teacher removed.
runtime:
  episodic_diagnostics: false
  malloc_trim_each_update: false
  stage_pixels_bf16: true
  vision_microbatch_images: 8
  window_attention_batch_steps: 32
training:
  activation_offload_backend: pinned_arena_v1
  cpu_optimizer_impl: deepspeed_cpu_adam
  dataloader_num_workers: 8
  dataloader_persistent_workers: true
  dataloader_pin_memory: false
  dataloader_prefetch_factor: 2
  gradient_accumulation_steps: 2
  optimizer_group_chunks: 1
