# Runtime profile H4: 4 x H100 80GB, one episode/rank, GAS2 (global batch 8),
# ZeRO-2 with GPU optimizer state (deepspeed.json).  Engineering only.
training:
  gradient_accumulation_steps: 2
  # Two persistent workers (prefetch 2 each) overlap cold Lustre reads + decode with
  # compute (0 workers: loading dominated, see reports/episodic_idea 05 and 01 D13).
  dataloader_num_workers: 2
  dataloader_prefetch_factor: 2
  dataloader_pin_memory: false
  dataloader_persistent_workers: true
  activation_offload_backend: pinned_arena_v1
  optimizer_group_chunks: 1   # 16 chunks cost +4.56 GiB GPU on 58K-token episodes (measured); host spike affordable at 512 GiB
runtime:
  stage_pixels_bf16: true
  malloc_trim_each_update: true
