# Runtime profile H2: 2 x H100 80GB, one episode/rank, GAS4 (global batch 8),
# ZeRO-2 with CPU optimizer offload (configs/deepspeed_zero2_cpu_optimizer.json,
# zero_force_ds_cpu_optimizer=false keeps the existing torch AdamW).
training:
  gradient_accumulation_steps: 4
  # Four persistent workers per rank; H2 sweep uses eight OMP/MKL threads per rank.
  dataloader_num_workers: 4
  dataloader_prefetch_factor: 2
  dataloader_pin_memory: false
  dataloader_persistent_workers: true
  activation_offload_backend: pinned_arena_v1
  optimizer_group_chunks: 1   # 16 chunks cost +4.56 GiB GPU on 58K-token episodes (measured); host spike affordable at 512 GiB
runtime:
  stage_pixels_bf16: true
  malloc_trim_each_update: false
